name: vpngate_terminal
description: Android SSH Terminal with Voice Input and Secure Key Storage
publish_to: 'none'
version: 1.0.0+71

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # SSH Terminal
  dartssh2: ^2.9.0
  xterm: ^4.0.0
  
  # Voice Input
  speech_to_text: ^7.0.0
  
  # Secure Storage (SSH keys, passwords)
  flutter_secure_storage: ^9.0.0
  
  # Local database (hosts, profiles)
  sqflite: ^2.3.0
  path: ^1.9.0
  
  # UI
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6
  
  # File picker (for importing keys)
  file_picker: ^8.0.0+1
  
  # Permissions
  permission_handler: ^11.3.0

  # Open URLs in browser
  url_launcher: ^6.2.5


  # HTTP Client
  http: ^1.6.0
  open_filex: ^4.3.4
  path_provider: ^2.1.2
  flutter_background: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
